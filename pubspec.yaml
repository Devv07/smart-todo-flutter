name: smart_todo
description: Advanced Smart Todo App with AI-powered task management, collaboration, analytics, and intelligent scheduling.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # UI & Animations
  flutter_animate: ^4.2.0
  lottie: ^2.7.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  flutter_staggered_animations: ^1.1.1

  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  firebase_firestore: ^4.14.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.6.0

  # API & HTTP
  dio: ^5.3.0
  pretty_dio_logger: ^1.3.1
  http: ^1.1.0

  # Date & Time
  intl: ^0.19.0
  timezone: ^0.9.2
  table_calendar: ^3.0.9

  # Notifications & Local Push
  flutter_local_notifications: ^16.2.0
  awesome_notifications: ^0.8.2

  # NLP & Text Processing
  nlp: ^0.2.0
  flutter_typeahead: ^4.8.0

  # Charts & Analytics
  fl_chart: ^0.63.0
  syncfusion_flutter_charts: ^23.1.36
  syncfusion_flutter_gauges: ^23.1.36

  # JSON Serialization
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1

  # Code Generation
  build_runner: ^2.4.6
  freezed: ^2.4.1
  freezed_annotation: ^2.4.1

  # Utilities
  uuid: ^4.0.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.1
  permission_handler: ^11.4.4
  device_info_plus: ^9.1.2

  # File Handling & Export
  pdf: ^3.10.5
  excel: ^2.0.0
  file_picker: ^6.1.1
  path: ^1.8.3
  share_plus: ^7.2.0

  # Logging
  logger: ^2.0.1
  sentry_flutter: ^7.88.0

  # Time Tracking & Pomodoro
  timer_builder: ^2.0.0
  wave: ^0.2.2

  # Speech to Text
  speech_to_text: ^6.3.0

  # Image Processing
  image_picker: ^1.0.4
  image_cropper: ^5.0.1

  # Authentication UI
  sign_in_with_google: ^2.4.0
  apple_sign_in: ^0.2.0

  # QR Code
  qr_flutter: ^4.1.0

  # Location Services
  geolocator: ^9.0.2
  geocoding: ^2.1.1

  # URL Launcher
  url_launcher: ^6.2.0
  share: ^2.0.4

  # Validators
  validators: ^3.0.0

  # Animations
  flip_card: ^0.7.0

  # Theme
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  freezed: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
